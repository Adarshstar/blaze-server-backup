name: Hourly Server Backup

# Self-sustaining loop: 6 hourly backups, then re-trigger itself.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [backup-loop]

permissions:
  contents: write
  actions: write

concurrency:
  group: server-backup-loop
  cancel-in-progress: false

jobs:
  backup-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 390
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          (command -v gh >/dev/null) || {
            curl -sL https://github.com/cli/cli/releases/download/v2.67.0/gh_2.67.0_linux_amd64.tar.gz | tar xz
            sudo cp gh_2.67.0_linux_amd64/bin/gh /usr/local/bin/gh
          }
          gh --version

      - name: Run 6 hourly backups then self-retrigger
        env:
          PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
          PTERO_URL: ${{ secrets.PTERO_URL }}
          PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${PTERO_API_KEY:-}"
          test -n "${PTERO_URL:-}"
          test -n "${PTERO_SERVER_ID:-}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          do_backup() {
            local TS ROOT H1 H2 BASE
            TS=$(date -u +%Y%m%d_%H%M%S)
            ROOT="backups/${TS}"; export ROOT
            mkdir -p "$ROOT"
            H1="Authorization: Bearer ${PTERO_API_KEY}"
            H2="Accept: application/json"
            BASE="${PTERO_URL}/api/client/servers/${PTERO_SERVER_ID}"

            echo "==== BACKUP $TS ===="
            curl -fsS -H "$H1" -H "$H2" "$BASE/resources" -o "$ROOT/resources.json" || true

            # Priority file list — production packs + world + config
            FILES=(
              "/server.properties"
              "/allowlist.json"
              "/permissions.json"
              "/packetlimitconfig.json"
              "/packet-statistics.txt"
              "/Dedicated_Server.txt"
              "/profanity_filter.wlist"
              "/config/default/permissions.json"
              "/behavior_packs/BlazeServerSystems/manifest.json"
              "/behavior_packs/BlazeServerSystems/scripts/main.js"
              "/behavior_packs/BlazeServerSystems/items/phone.json"
              "/behavior_packs/BlazeServerSystems/texts/en_US.lang"
              "/resource_packs/BlazePhoneRP/manifest.json"
              "/resource_packs/BlazePhoneRP/textures/item_texture.json"
              "/resource_packs/BlazePhoneRP/textures/items/blaze_phone.png"
              "/resource_packs/BlazePhoneRP/texts/en_US.lang"
              "/development_behavior_packs/BlazeServerSystems/manifest.json"
              "/development_behavior_packs/BlazeServerSystems/scripts/main.js"
              "/development_behavior_packs/BlazeServerSystems/items/phone.json"
              "/development_resource_packs/BlazePhoneRP/manifest.json"
              "/development_resource_packs/BlazePhoneRP/textures/item_texture.json"
              "/development_resource_packs/BlazePhoneRP/textures/items/blaze_phone.png"
              "/worlds/Bedrock level/level.dat"
              "/worlds/Bedrock level/level.dat_old"
              "/worlds/Bedrock level/levelname.txt"
              "/worlds/Bedrock level/world_behavior_packs.json"
              "/worlds/Bedrock level/world_resource_packs.json"
            )

            mkdir -p "$ROOT/files"
            for f in "${FILES[@]}"; do
              enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$f")
              dest="$ROOT/files${f}"
              mkdir -p "$(dirname "$dest")"
              if curl -fsS -H "$H1" -H "$H2" "$BASE/files/contents?file=$enc" -o "$dest"; then
                echo "OK $f ($(wc -c < "$dest") bytes)"
              else
                echo "MISS $f"
                rm -f "$dest"
              fi
            done

            # Recursive download from key dirs (skip vanilla bulk packs)
            python3 << 'PY'
          import os, json, urllib.request, urllib.parse
          from pathlib import Path

          API_KEY = os.environ["PTERO_API_KEY"]
          BASE = f'{os.environ["PTERO_URL"].rstrip("/")}/api/client/servers/{os.environ["PTERO_SERVER_ID"]}'
          OUT = Path(os.environ["ROOT"])
          MAX_FILE = 12 * 1024 * 1024
          headers = {"Authorization": f"Bearer {API_KEY}", "Accept": "application/json", "User-Agent": "BlazeBackup/2"}

          def req(url):
              r = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(r, timeout=90) as res:
                  return res.read()

          def list_dir(path):
              q = urllib.parse.quote(path, safe="")
              data = json.loads(req(f"{BASE}/files/list?directory={q}"))
              return data.get("data") or []

          def download(path, dest: Path):
              try:
                  q = urllib.parse.quote(path, safe="")
                  data = req(f"{BASE}/files/contents?file={q}")
                  if len(data) > MAX_FILE:
                      print(f"SKIP large {path} ({len(data)})")
                      return
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
                  print(f"OK {path} ({len(data)})")
              except Exception as e:
                  print(f"FAIL {path}: {e}")

          roots = [
              "/behavior_packs/BlazeServerSystems",
              "/behavior_packs/BlazeServerSystems/scripts",
              "/behavior_packs/BlazeServerSystems/items",
              "/behavior_packs/BlazeServerSystems/texts",
              "/resource_packs/BlazePhoneRP",
              "/resource_packs/BlazePhoneRP/textures",
              "/resource_packs/BlazePhoneRP/textures/items",
              "/resource_packs/BlazePhoneRP/texts",
              "/development_behavior_packs",
              "/development_behavior_packs/BlazeServerSystems",
              "/development_behavior_packs/BlazeServerSystems/scripts",
              "/development_behavior_packs/BlazeServerSystems/items",
              "/development_resource_packs",
              "/development_resource_packs/BlazePhoneRP",
              "/development_resource_packs/BlazePhoneRP/textures",
              "/development_resource_packs/BlazePhoneRP/textures/items",
              "/config",
              "/config/default",
              "/worlds",
              "/worlds/Bedrock level",
              "/worlds/Bedrock level/db",
          ]

          skip_names = {
              "chemistry", "editor", "vanilla", "vanilla_base",
              "server_library", "server_ui_library", "server_editor_library",
              "experimental_creator_cameras", "experimental_poi",
              "experimental_vanilla_shapes", "experimental_villager_trade",
          }

          for root in roots:
              try:
                  entries = list_dir(root)
              except Exception as e:
                  print(f"list fail {root}: {e}")
                  continue
              for ent in entries:
                  attr = ent.get("attributes") or {}
                  name = attr.get("name") or ""
                  if any(name.startswith(s) for s in skip_names) or name in skip_names:
                      continue
                  if name.startswith("vanilla_") or name.startswith("chemistry_"):
                      continue
                  path = f"{root.rstrip('/')}/{name}"
                  if not attr.get("is_file", True) and attr.get("mimetype") == "inode/directory":
                      continue  # only files here; subdirs listed in roots
                  size = attr.get("size") or 0
                  if size > MAX_FILE:
                      print(f"SKIP large {path} ({size})")
                      continue
                  if attr.get("is_file", True):
                      download(path, OUT / "files" / path.lstrip("/"))

          # content logs at root
          try:
              for ent in list_dir("/"):
                  attr = ent.get("attributes") or {}
                  name = attr.get("name") or ""
                  if name.startswith("ContentLog") and attr.get("is_file"):
                      download(f"/{name}", OUT / "files" / name)
          except Exception as e:
              print("contentlog", e)

          print("recursive done")
          PY

            # Manifest summary
            {
              echo "timestamp_utc=$TS"
              echo "server_id=$PTERO_SERVER_ID"
              find "$ROOT/files" -type f 2>/dev/null | wc -l | xargs -I{} echo "file_count={}"
              du -sh "$ROOT" 2>/dev/null | awk '{print "size="$1}'
            } > "$ROOT/MANIFEST.txt"
            cat "$ROOT/MANIFEST.txt"

            git add -A
            if git diff --cached --quiet; then
              echo "No changes to commit"
            else
              git commit -m "backup ${TS}"
              for i in 1 2 3 4 5; do
                git pull --rebase origin master && git push origin HEAD:master && break
                sleep 3
                git pull --rebase origin master || true
              done
            fi
          }

          for hour in 1 2 3 4 5 6; do
            echo "===== LOOP HOUR $hour/6 ====="
            do_backup || echo "backup hour $hour failed (continuing)"
            if [ "$hour" -lt 6 ]; then
              echo "Sleeping 3600s..."
              sleep 3600
            fi
          done

          echo "Re-triggering next loop..."
          OWNER_REPO="${GITHUB_REPOSITORY}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER_REPO}/actions/workflows/hourly-backup.yml/dispatches" \
            -d '{"ref":"master"}' \
            && echo "retriggered" || echo "retrigger failed"
