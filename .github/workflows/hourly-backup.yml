name: Hourly Server Backup

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download server files from panel
        env:
          PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
          PTERO_URL: ${{ secrets.PTERO_URL }}
          PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
        run: |
          set -euo pipefail
          test -n "$PTERO_API_KEY" && test -n "$PTERO_URL" && test -n "$PTERO_SERVER_ID"
          TS=$(date -u +%Y%m%d_%H%M%S)
          DIR="backups/${TS}"
          mkdir -p "$DIR/addon/scripts" "$DIR/addon/items" "$DIR/worlds"
          H1="Authorization: Bearer ${PTERO_API_KEY}"
          H2="Accept: application/json"
          BASE="${PTERO_URL}/api/client/servers/${PTERO_SERVER_ID}"
          curl -fsS -H "$H1" -H "$H2" "$BASE/resources" -o "$DIR/resources.json"
          curl -fsS -H "$H1" -H "$H2" "$BASE/files/contents?file=/server.properties" -o "$DIR/server.properties" || true
          curl -fsS -H "$H1" -H "$H2" "$BASE/files/contents?file=/development_behavior_packs/BlazeServerSystems/manifest.json" -o "$DIR/addon/manifest.json" || true
          curl -fsS -H "$H1" -H "$H2" "$BASE/files/contents?file=/development_behavior_packs/BlazeServerSystems/scripts/main.js" -o "$DIR/addon/scripts/main.js" || true
          curl -fsS -H "$H1" -H "$H2" "$BASE/files/contents?file=/development_behavior_packs/BlazeServerSystems/items/phone.json" -o "$DIR/addon/items/phone.json" || true
          curl -fsS -H "$H1" -H "$H2" "$BASE/files/contents?file=/worlds/Bedrock%20level/level.dat" -o "$DIR/worlds/level.dat" || true
          curl -fsS -H "$H1" -H "$H2" "$BASE/files/list?directory=/" -o "$DIR/root_listing.json" || true
          ls -laR "$DIR" | head -40
          ls -1d backups/20* 2>/dev/null | sort -r | tail -n +49 | xargs -r rm -rf || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "backup: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin master || git pull --rebase origin main || true
          git push origin HEAD:master || git push origin HEAD:main
