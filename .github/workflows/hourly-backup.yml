name: Hourly Server Backup

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Full recursive panel backup
        env:
          PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
          PTERO_URL: ${{ secrets.PTERO_URL }}
          PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
        run: |
          set -euo pipefail
          test -n "${PTERO_API_KEY:-}"
          test -n "${PTERO_URL:-}"
          test -n "${PTERO_SERVER_ID:-}"

          TS=$(date -u +%Y%m%d_%H%M%S)
          ROOT="backups/${TS}"
          mkdir -p "$ROOT"
          H1="Authorization: Bearer ${PTERO_API_KEY}"
          H2="Accept: application/json"
          BASE="${PTERO_URL}/api/client/servers/${PTERO_SERVER_ID}"

          # Max single file size to download (bytes) — skip huge binary chunks
          MAX_FILE=5242880   # 5 MB per file
          MAX_TOTAL=104857600 # 100 MB total soft cap

          curl -fsS -H "$H1" -H "$H2" "$BASE/resources" -o "$ROOT/resources.json"

          python3 << 'PY'
          import os, json, urllib.request, pathlib, sys

          api_key = os.environ["PTERO_API_KEY"]
          base = os.environ["PTERO_URL"].rstrip("/") + "/api/client/servers/" + os.environ["PTERO_SERVER_ID"]
          root = os.environ.get("BACKUP_ROOT") or None
          PY

          export BACKUP_ROOT="$ROOT"
          python3 << PY
          import os, json, urllib.parse, urllib.request, pathlib

          API_KEY = os.environ["PTERO_API_KEY"]
          BASE = os.environ["PTERO_URL"].rstrip("/") + "/api/client/servers/" + os.environ["PTERO_SERVER_ID"]
          OUT = pathlib.Path(os.environ["BACKUP_ROOT"])
          MAX_FILE = 5 * 1024 * 1024
          MAX_TOTAL = 120 * 1024 * 1024
          total = 0
          skipped = []

          def req(url):
              r = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {API_KEY}",
                  "Accept": "application/json",
              })
              with urllib.request.urlopen(r, timeout=120) as res:
                  return res.read()

          def list_dir(directory):
              q = urllib.parse.quote(directory if directory.startswith("/") else "/" + directory)
              url = f"{BASE}/files/list?directory={q}"
              data = json.loads(req(url).decode())
              return data.get("data", [])

          def download_file(path, dest: pathlib.Path):
              global total
              q = urllib.parse.quote(path)
              url = f"{BASE}/files/contents?file={q}"
              try:
                  data = req(url)
              except Exception as e:
                  skipped.append(f"{path}: {e}")
                  return
              if len(data) > MAX_FILE:
                  skipped.append(f"{path}: too large ({len(data)} bytes)")
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.with_suffix(dest.suffix + ".skipped.txt").write_text(
                      f"Skipped {path} size={len(data)}\n"
                  )
                  return
              if total + len(data) > MAX_TOTAL:
                  skipped.append(f"{path}: total budget exceeded")
                  return
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              total += len(data)
              print(f"OK {len(data):8d}  {path}")

          # Always include these roots
          roots = ["/", "/development_behavior_packs", "/development_resource_packs",
                   "/resource_packs", "/behavior_packs", "/worlds", "/worlds/Bedrock level"]

          seen_dirs = set()
          queue = ["/"]

          while queue:
              d = queue.pop(0)
              if d in seen_dirs:
                  continue
              seen_dirs.add(d)
              try:
                  entries = list_dir(d)
              except Exception as e:
                  skipped.append(f"list {d}: {e}")
                  continue
              # save listing
              list_path = OUT / "listings" / (d.strip("/").replace("/", "_") or "root")
              list_path = list_path.with_suffix(".json")
              list_path.parent.mkdir(parents=True, exist_ok=True)
              list_path.write_text(json.dumps(entries, indent=2)[:500000])

              for ent in entries:
                  attr = ent.get("attributes", {})
                  name = attr.get("name", "")
                  is_file = attr.get("is_file", False)
                  size = attr.get("size", 0) or 0
                  path = (d.rstrip("/") + "/" + name) if d != "/" else "/" + name
                  # skip noisy huge runtime
                  if name in (".git", "node_modules", "cache", "tmp"):
                      continue
                  if not is_file:
                      # limit depth into world db
                      if "/db" in path and path.count("/") > 4:
                          continue
                      queue.append(path)
                      continue
                  # skip very large ldb files but note them
                  if size > MAX_FILE or name.endswith(".ldb") and size > 500000:
                      skipped.append(f"{path}: size {size}")
                      note = OUT / "skipped_large"
                      note.mkdir(parents=True, exist_ok=True)
                      (note / name.replace("/", "_")).write_text(f"{path}\nsize={size}\n")
                      continue
                  rel = path.lstrip("/")
                  download_file(path, OUT / "files" / rel)

          (OUT / "skipped.json").write_text(json.dumps(skipped, indent=2))
          (OUT / "summary.txt").write_text(f"total_bytes={total}\nfiles_dir=files/\nskipped={len(skipped)}\n")
          print(f"DONE total={total} skipped={len(skipped)}")
          PY

          echo "Backup tree:"
          du -sh "$ROOT" || true
          find "$ROOT" -type f | wc -l

          # retention: keep last 24 backup folders
          ls -1d backups/20* 2>/dev/null | sort -r | tail -n +25 | xargs -r rm -rf || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backups
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "backup full: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 5
            git pull --rebase origin master || true
          done
          exit 1
